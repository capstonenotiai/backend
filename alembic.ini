# Alembic 설정 — DB 주소는 .env 의 DATABASE_URL 을 사용 (migrations/env.py)
#
#   alembic revision --autogenerate -m "설명"   models.py 변경 → 마이그레이션 파일 생성 (생성 후 꼭 내용 확인)
#   alembic upgrade head                        적용 (서버 시작 시에도 자동 실행)
#   alembic downgrade -1                        한 단계 되돌리기
#   alembic current / history                   현재 버전 / 이력

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
