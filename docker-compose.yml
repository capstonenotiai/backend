# NotiAI 로컬 개발용
#
#   docker compose up -d db          MySQL 만 실행 (백엔드는 로컬 uvicorn 으로 개발)
#   docker compose up -d --build     MySQL + 백엔드 컨테이너 둘 다
#
# 비밀번호 등은 같은 폴더의 .env 에서 읽음 (없으면 아래 기본값)

# 폴더 이름(backend)을 프로젝트 이름으로 쓰면 다른 'backend' 프로젝트 컨테이너와 섞이므로 고정
name: notiai

services:
  db:
    image: mysql:8.4
    container_name: notiai-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-notiai}
      MYSQL_USER: ${MYSQL_USER:-notiai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-notiai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # PC 에 설치된 MySQL 이 3306 을 쓰고 있어서 3307 로 노출
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    container_name: notiai-api
    restart: unless-stopped
    env_file: .env
    environment:
      # 컨테이너 안에서는 localhost 가 아니라 서비스 이름(db)으로 접속
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-notiai}:${MYSQL_PASSWORD:-notiai}@db:3306/${MYSQL_DATABASE:-notiai}?charset=utf8mb4
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
